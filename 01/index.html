<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>CS460 - Hello Cube</title>
    <style>
      html, body {
        background-color: #000;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
    </style>
    <script type="text/javascript" src="https://get.goXTK.com/xtk_edge.js"></script>
    <script type="text/javascript">
      window.onload = function() {
        // Create and initialize 3D renderer
        var r = new X.renderer3D();
        r.init();

        // Create a cube and add it to the renderer
        var cube = new X.cube();
        r.add(cube);

        // Render the scene
        r.render();
      };
    </script>
  </head>
  <body>
  </body>
</html>
